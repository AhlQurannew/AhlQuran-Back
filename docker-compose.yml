services:
  db:
    image: postgres:15-alpine
    container_name: ahlquran-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahlquran_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahlquran_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ahlquran_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ahlquran-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahlquran_user -d ahlquran_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahlquran-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ahlquran_user:ahlquran_pass@db:5432/ahlquran_db}
      SECRET_KEY: ${SECRET_KEY:-ahlquran2024secretkeyprojectlaib}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: "true"
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    networks:
      - ahlquran-network
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ahlquran-network:
    driver: bridge
