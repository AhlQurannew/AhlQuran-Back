services:
  db:
    image: postgres:15-alpine
    ports:
      - "${DB_PORT:-5433}:5432"
    env_file:
      - ./ahlQuran_Back/.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: postgres:15-alpine
    env_file:
      - ./ahlQuran_Back/.env
    command:
      - sh
      - -ec
      - |
        echo "Waiting for database to be ready..."
        until pg_isready --host=db --port=5432 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB; do
          sleep 2
        done

        if PGPASSWORD=$$POSTGRES_PASSWORD psql --host=db --port=5432 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB -tAc "SELECT to_regclass('public.users') IS NOT NULL;" | grep -q t; then
          echo "Database schema already present. Skipping bootstrap restore."
        else
          echo "Database schema missing. Bootstrapping from backup..."
          PGPASSWORD=$$POSTGRES_PASSWORD psql --host=db --port=5432 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --file=/backup/database_backup.sql
          echo "Backup restore completed."
        fi
    volumes:
      - ./ahlQuran_Back/database_backup.sql:/backup/database_backup.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./ahlQuran_Back
      dockerfile: Dockerfile
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w 4
      -b 0.0.0.0:8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./ahlQuran_Back/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "false"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./ahlQuran_Front
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "/api"
        API_VERSION: "v1"
        ENVIRONMENT: "production"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

  db_restore:
    image: postgres:15-alpine
    env_file:
      - ./ahlQuran_Back/.env
    profiles: ["restore"]
    command:
      - sh
      - -ec
      - |
        echo "Waiting for database to be ready..."
        until pg_isready --host=db --port=5432 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB; do
          sleep 2
        done
        echo "Restoring backup..."
        PGPASSWORD=$$POSTGRES_PASSWORD psql --host=db --port=5432 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --file=/backup/database_backup.sql
        echo "Backup restored."
    volumes:
      - ./ahlQuran_Back/database_backup.sql:/backup/database_backup.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data_prod:
  backend_uploads:
